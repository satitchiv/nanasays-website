name: Comparison Curator - UK comparison values
run-name: Comparison Curator - UK comparison values (${{ github.event_name }})

on:
  schedule:
    # Twice daily, UTC. The script collapses retries into the same 00:00/12:00
    # slot key, so a duplicate delivery is a logged no-op.
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Use dry-run for the first manual smoke test; apply writes only verified missing cells.'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: research-room-uk-comparison-values
  cancel-in-progress: false

jobs:
  run:
    name: Fill verified missing UK comparison values
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      RESEARCH_ROOM_AUTOMATION_OWNER: comparison-curator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Provide CI env file
        run: touch .env.local
      - name: Run verified UK comparison scheduler
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npm run research:batch:uk-comparisons -- --apply --scheduled --json
          else
            npm run research:batch:uk-comparisons -- --${{ inputs.mode }} --json
          fi
      - name: Record curator ownership
        if: always()
        shell: bash
        run: |
          {
            echo "### Research Room Comparison Curator"
            echo "- Responsibility: fill verified missing UK comparison values"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Result: ${{ job.status }}"
            echo "- AI/model calls: none"
            echo "- Website crawling: disabled by the scheduler safety contract"
          } >> "$GITHUB_STEP_SUMMARY"
