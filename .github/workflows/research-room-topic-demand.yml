name: Comparison Curator - topic demand
run-name: Comparison Curator - topic demand (${{ github.event_name }})

on:
  schedule:
    # Run after the comparison refresh so newly verified coverage is already
    # available when parents see promoted topics.
    - cron: '30 0,12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Use dry-run first; apply promotes verified database topics and repeated parent demand.'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: research-room-topic-demand
  cancel-in-progress: false

jobs:
  run:
    name: Promote evidence-backed comparison topics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      RESEARCH_ROOM_AUTOMATION_OWNER: comparison-curator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Provide CI env file
        run: touch .env.local
      - name: Promote repeated Research Room topic demand
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npm run research:batch:topic-demand -- --apply --scheduled --json
          else
            npm run research:batch:topic-demand -- --${{ inputs.mode }} --json
          fi
      - name: Record curator ownership
        if: always()
        shell: bash
        run: |
          {
            echo "### Research Room Comparison Curator"
            echo "- Responsibility: promote evidence-backed parent comparison topics"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Result: ${{ job.status }}"
            echo "- AI/model calls: none"
            echo "- Website crawling: disabled by the topic-creator safety contract"
          } >> "$GITHUB_STEP_SUMMARY"
