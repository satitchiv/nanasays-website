name: Research Room canonical guard

on:
  push:
    branches:
      - main
      - slice-6.5
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-room-canonical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify canonical Research Room
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:research-room:canonical
